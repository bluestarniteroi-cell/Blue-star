<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b5cff"><meta name="description" content="Blue Star - Controle de Estoque"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icons/icon-192.png"><title>Blue Star • Estoque</title><style>
:root{--blue:#0b5cff;--dark:#10213b;--bg:#f4f7fb;--card:#fff;--muted:#667085;--danger:#d92d20;--ok:#087443}*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:#182230}header{background:linear-gradient(135deg,#0b5cff,#1640a8);color:#fff;padding:18px 16px 22px;position:sticky;top:0;z-index:5;box-shadow:0 3px 14px #0002}.brand{display:flex;align-items:center;gap:12px}.brand img{width:52px;height:52px;border-radius:12px;background:#fff;padding:5px;object-fit:contain}.brand h1{margin:0;font-size:22px}.brand small{opacity:.85}.wrap{max-width:900px;margin:auto;padding:16px 14px 90px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.card{background:var(--card);border-radius:16px;padding:14px;box-shadow:0 2px 12px #14213d12;margin-bottom:12px}.stat b{display:block;font-size:24px;margin-top:5px}.muted{color:var(--muted);font-size:13px}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:12px 0}.tabs button,.btn{border:0;border-radius:10px;padding:11px 10px;font-weight:700;cursor:pointer}.tabs button{background:#e7eefc;color:#17479c}.tabs button.active,.btn.primary{background:var(--blue);color:#fff}.btn{background:#e9edf3;color:#24334a}.btn.danger{background:#ffe5e3;color:var(--danger)}form{display:grid;gap:10px}label{font-size:13px;font-weight:700}input,select,textarea{width:100%;padding:12px;border:1px solid #d0d5dd;border-radius:10px;font-size:15px;background:#fff}textarea{min-height:70px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.actions{display:flex;gap:8px;flex-wrap:wrap}.item{display:flex;justify-content:space-between;gap:12px;align-items:center;border-top:1px solid #eaecf0;padding:12px 0}.item:first-child{border-top:0}.badge{display:inline-block;border-radius:999px;padding:5px 8px;font-size:12px;font-weight:700}.ok{background:#dcfae6;color:var(--ok)}.low{background:#fee4e2;color:var(--danger)}.empty{text-align:center;padding:25px;color:var(--muted)}.install{background:#eaf2ff;border:1px solid #bfd4ff;color:#1640a8}.hidden{display:none!important}@media(max-width:650px){.grid{grid-template-columns:repeat(2,1fr)}.tabs{grid-template-columns:repeat(2,1fr)}.row{grid-template-columns:1fr}.stat b{font-size:20px}}
</style></head><body><header><div class="brand"><img id="logo" src="assets/logo.png" alt="Blue Star"><div><h1>Blue Star</h1><small>Controle de Estoque</small></div></div></header><main class="wrap"><section id="installBox" class="card install hidden"><b>Instale o Blue Star no seu celular</b><p class="muted">No Chrome, toque em ⋮ → <b>Instalar aplicativo</b> ou <b>Adicionar à tela inicial</b>.</p><button class="btn primary" id="installBtn">Instalar agora</button></section><section class="grid"><div class="card stat"><span class="muted">Produtos</span><b id="sProducts">0</b></div><div class="card stat"><span class="muted">Unidades</span><b id="sUnits">0</b></div><div class="card stat"><span class="muted">Entradas</span><b id="sIn">0</b></div><div class="card stat"><span class="muted">Saídas</span><b id="sOut">0</b></div></section><div class="tabs"><button class="active" data-tab="home">Estoque</button><button data-tab="cad">Cadastrar</button><button data-tab="mov">Movimentar</button><button data-tab="hist">Histórico</button></div><section id="home" class="tab"><div class="card"><div class="row"><input id="search" placeholder="Pesquisar produto, marca ou modelo"><button class="btn" id="exportBtn">Exportar backup</button></div></div><div class="card"><h3>Estoque atual</h3><div id="stockList"></div></div></section><section id="cad" class="tab hidden"><div class="card"><h3>Novo produto</h3><form id="productForm"><div class="row"><div><label>Produto</label><input id="pName" required placeholder="Ex.: Capa Case"></div><div><label>Marca</label><input id="pBrand" placeholder="Marca"></div></div><div class="row"><div><label>Modelo</label><input id="pModel" placeholder="Modelo"></div><div><label>Quantidade inicial</label><input id="pQty" type="number" min="0" value="0" required></div></div><div><label>Estoque mínimo</label><input id="pMin" type="number" min="0" value="0"></div><button class="btn primary">Cadastrar produto</button></form></div><div class="card"><h3>Informações da empresa</h3><form id="companyForm"><div class="row"><input id="cnpj" placeholder="CNPJ"><input id="phone" placeholder="Telefone"></div><input id="sector" placeholder="Setor do estoque"><button class="btn">Salvar informações</button></form></div></section><section id="mov" class="tab hidden"><div class="card"><h3>Registrar movimentação</h3><form id="moveForm"><label>Produto</label><select id="mProduct" required></select><div class="row"><div><label>Tipo</label><select id="mType"><option value="in">Entrada</option><option value="out">Saída</option></select></div><div><label>Quantidade</label><input id="mQty" type="number" min="1" value="1" required></div></div><textarea id="mObs" placeholder="Observação (opcional)"></textarea><button class="btn primary">Registrar</button></form></div></section><section id="hist" class="tab hidden"><div class="card"><h3>Histórico</h3><div id="historyList"></div></div></section></main><script>
const KEY='bluestar_estoque_v1';let db=JSON.parse(localStorage.getItem(KEY)||'{"products":[],"moves":[],"company":{}}');let deferred=null;const $=id=>document.getElementById(id);function save(){localStorage.setItem(KEY,JSON.stringify(db));render()}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function render(){const ps=db.products; $('sProducts').textContent=ps.length;$('sUnits').textContent=ps.reduce((a,p)=>a+p.qty,0);$('sIn').textContent=db.moves.filter(x=>x.type==='in').reduce((a,x)=>a+x.qty,0);$('sOut').textContent=db.moves.filter(x=>x.type==='out').reduce((a,x)=>a+x.qty,0);let q=$('search').value.toLowerCase();let arr=ps.filter(p=>(p.name+' '+p.brand+' '+p.model).toLowerCase().includes(q));$('stockList').innerHTML=arr.length?arr.map(p=>`<div class="item"><div><b>${esc(p.name)}</b><div class="muted">${esc(p.brand)} ${esc(p.model)}</div></div><div style="text-align:right"><span class="badge ${p.qty<=p.min?'low':'ok'}">${p.qty} un.</span><div class="muted">mín. ${p.min}</div></div></div>`).join(''):'<div class="empty">Nenhum produto cadastrado.</div>';$('mProduct').innerHTML=ps.length?ps.map(p=>`<option value="${p.id}">${esc(p.name)} — ${p.qty} un.</option>`).join(''):'<option value="">Cadastre um produto primeiro</option>';$('historyList').innerHTML=db.moves.length?[...db.moves].reverse().map(x=>{let p=ps.find(p=>p.id===x.productId);return `<div class="item"><div><b>${x.type==='in'?'Entrada':'Saída'} — ${esc(p?.name||'Produto removido')}</b><div class="muted">${new Date(x.date).toLocaleString('pt-BR')} · ${esc(x.obs||'Sem observação')}</div></div><span class="badge ${x.type==='in'?'ok':'low'}">${x.type==='in'?'+':'-'}${x.qty}</span></div>`}).join(''):'<div class="empty">Nenhuma movimentação registrada.</div>';if(db.company){$('cnpj').value=db.company.cnpj||'';$('phone').value=db.company.phone||'';$('sector').value=db.company.sector||''}}
$('search').oninput=render;$('productForm').onsubmit=e=>{e.preventDefault();let p={id:crypto.randomUUID(),name:$('pName').value.trim(),brand:$('pBrand').value.trim(),model:$('pModel').value.trim(),qty:+$('pQty').value,min:+$('pMin').value};db.products.push(p);e.target.reset();$('pQty').value=0;$('pMin').value=0;save();alert('Produto cadastrado!')};$('moveForm').onsubmit=e=>{e.preventDefault();let p=db.products.find(p=>p.id==$('mProduct').value),qty=+$('mQty').value,type=$('mType').value;if(!p)return alert('Cadastre um produto primeiro.');if(type==='out'&&qty>p.qty)return alert('Quantidade insuficiente em estoque.');p.qty+=type==='in'?qty:-qty;db.moves.push({productId:p.id,type,qty,obs:$('mObs').value.trim(),date:new Date().toISOString()});e.target.reset();$('mQty').value=1;save();alert('Movimentação registrada!')};$('companyForm').onsubmit=e=>{e.preventDefault();db.company={cnpj:$('cnpj').value,phone:$('phone').value,sector:$('sector').value};save();alert('Informações salvas!')};document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('.tab').forEach(x=>x.classList.add('hidden'));$(b.dataset.tab).classList.remove('hidden')});$('exportBtn').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='backup-blue-star-estoque.json';a.click()};window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;$('installBox').classList.remove('hidden')});$('installBtn').onclick=async()=>{if(deferred){deferred.prompt();await deferred.userChoice;deferred=null;$('installBox').classList.add('hidden')}};if('serviceWorker'in navigator)navigator.serviceWorker.register('service-worker.js');render();
</script></body></html>
